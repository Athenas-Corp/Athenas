name: CI - NestJS Quality Gate

on:
  pull_request:
    branches:
      - main
     
  push:
    branches:
      - '**'
      - '!main'
      
jobs:
  quality-check:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request' || (github.event_name == 'push' && !contains(fromJson('["main", "dev", "hml"]'), github.ref_name))
    
    steps:
      - name: Block direct push to protected branches
        if: github.event_name == 'push' && contains(fromJson('["main", "dev", "hml"]'), github.ref_name)
        run: |
          echo "Push direto para a branch ${{ github.ref_name }} não é permitido!"
          echo "Use Pull Requests para fazer alterações nessas branches."
          exit 1

      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Lint check
        run: npm run lint

      - name: Run tests with coverage (services only)
        run: |
          echo "🧪 Executando testes dos services com cobertura..."
          
          # Limpar cobertura anterior
          rm -rf coverage/
          
          # Executar testes com configuração mais específica
          npm run test:cov -- \
            --testPathPattern=".*\.service\.spec\.ts$" \
            --collectCoverageFrom="src/**/*.service.ts" \
            --collectCoverageFrom="!src/**/*.spec.ts" \
            --collectCoverageFrom="!src/**/*.test.ts" \
            --collectCoverageFrom="!src/**/*.module.ts" \
            --collectCoverageFrom="!src/**/*.config.ts" \
            --forceExit \
            --verbose

      - name: Debug coverage files
        run: |
          echo "🔍 Verificando arquivos de cobertura gerados..."
          find . -name "*coverage*" -type f -exec ls -la {} \;
          
          if [ -f "coverage/coverage-summary.json" ]; then
            echo "📄 Conteúdo do coverage-summary.json:"
            cat coverage/coverage-summary.json
          else
            echo "❌ Arquivo coverage-summary.json não encontrado"
          fi

      - name: Validate 60% test coverage
        run: |
          # Verificar se arquivo existe
          if [ ! -f "coverage/coverage-summary.json" ]; then
            echo "❌ Arquivo de cobertura não encontrado"
            echo "📁 Listando todos os arquivos de coverage:"
            find . -name "*coverage*" -type f 2>/dev/null || echo "Nenhum arquivo encontrado"
            exit 1
          fi
          
          echo "✅ Arquivo coverage-summary.json encontrado"
          
          # Parsing robusto usando Node.js com validação
          COVERAGE=$(node -e "
            try {
              const fs = require('fs');
              const coverageContent = fs.readFileSync('./coverage/coverage-summary.json', 'utf8');
              console.error('Raw content:', coverageContent);
              
              const coverage = JSON.parse(coverageContent);
              console.error('Parsed coverage:', JSON.stringify(coverage, null, 2));
              
              if (!coverage.total) {
                console.error('No coverage.total found');
                console.log('0');
                process.exit(0);
              }
              
              const pct = parseFloat(coverage.total.lines?.pct || 0);
              console.error('Lines percentage:', pct);
              console.log(isNaN(pct) ? '0' : pct);
            } catch (error) {
              console.error('Error processing coverage:', error.message);
              console.log('0');
            }
          ")
          
          echo "📊 Test Coverage: ${COVERAGE}%"
          
          # Validação de cobertura
          if [ "$COVERAGE" = "0" ] || [ -z "$COVERAGE" ]; then
            echo "❌ Cobertura não pôde ser determinada ou é 0%"
            echo "🔍 Verificando se os testes realmente executaram..."
            
            # Verificar se há arquivos .service.ts que deveriam ser testados
            SERVICES_COUNT=$(find src -name "*.service.ts" | wc -l)
            echo "📈 Arquivos service encontrados: $SERVICES_COUNT"
            
            if [ "$SERVICES_COUNT" -eq "0" ]; then
              echo "⚠️ Nenhum arquivo .service.ts encontrado - pulando validação de cobertura"
              exit 0
            else
              echo "❌ Falha na coleta de cobertura"
              exit 1
            fi
          fi
          
          # Comparação usando Node.js (mais confiável que bc)
          PASSED=$(node -e "console.log(${COVERAGE} >= 60 ? 'true' : 'false')")
          
          if [ "$PASSED" = "false" ]; then
            echo "❌ Cobertura de ${COVERAGE}% abaixo de 60%"
            exit 1
          else
            echo "✅ Cobertura de ${COVERAGE}% está adequada"
          fi

      - name: Validate no console.* usage
        run: |
          echo "🚫 Verificando uso de console.* (linhas não comentadas)..."
          
          # Buscar console.* que não estão comentados
          CONSOLE_USAGE=$(grep -r --include=*.ts "^\s*console\." ./src | grep -v "^\s*//" | grep -v "^\s*\*" || true)
          
          if [ -n "$CONSOLE_USAGE" ]; then
            echo "❌ Uso de console.log ou console.* ativo encontrado:"
            echo "$CONSOLE_USAGE"
            echo "📝 Remova ou comente essas linhas, ou use um logger adequado"
            exit 1
          else
            echo "✅ Nenhum console.* ativo encontrado"
          fi

      - name: Run SonarQube analysis with Quality Gate
        if: github.event_name == 'pull_request' || github.ref_name != 'main'
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "🔍 Executando análise SonarQube..."
          
          # Verificar se o arquivo de cobertura existe
          if [ ! -f "coverage/lcov.info" ]; then
            echo "⚠️ Arquivo lcov.info não encontrado, executando testes novamente..."
            npm run test:cov -- --testPathPattern=".*\.service\.spec\.ts$"
          fi
          
          npm install -g sonar-scanner
          
          # Executar análise SonarQube com configurações corretas
          sonar-scanner \
            -Dsonar.projectKey=Athenas-Corp_Athenas \
            -Dsonar.organization=athenas-corp \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.sources=src \
            -Dsonar.tests=src \
            -Dsonar.test.inclusions="**/*.spec.ts,**/*.test.ts" \
            -Dsonar.exclusions="**/*.spec.ts,**/*.test.ts,**/node_modules/**,**/dist/**" \
            -Dsonar.coverage.exclusions="**/*.controller.ts,**/*.module.ts,**/*.dto.ts,**/main.ts,**/config/**/*.ts,**/migrations/**/*.ts,**/filters/**/*.ts,**/interceptors/**/*.ts,**/pipes/**/*.ts,**/entities/**/*.ts,**/interfaces/**/*.ts" \
            -Dsonar.typescript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.qualitygate.wait=true \
            -Dsonar.qualitygate.timeout=300 \
            -Dsonar.typescript.tsconfigPath=tsconfig.json
          
          echo "✅ Análise SonarQube concluída com sucesso"

      - name: Validate version bump (PR only)
        if: github.event_name == 'pull_request'
        run: |
          git fetch origin main
          BASE_VERSION=$(git show origin/main:package.json | jq -r .version)
          CURRENT_VERSION=$(jq -r .version package.json)
          echo "Base: $BASE_VERSION, Atual: $CURRENT_VERSION"
          
          if [ "$BASE_VERSION" = "$CURRENT_VERSION" ]; then
            echo "❌ Versão do package.json precisa ser atualizada."
            exit 1
          else
            echo "✅ Versão foi atualizada corretamente"
          fi

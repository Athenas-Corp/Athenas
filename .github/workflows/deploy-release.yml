name: Deploy and Tag Release

on:
  push:
    branches:
      - main
      
    paths-ignore:
      - 'package.json'
      - 'package-lock.json'

jobs:
  deploy:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Use Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run linting
        run: |
          echo "🔍 Executando verificação de lint..."
          npm run lint

      - name: Run tests with coverage
        run: |
          echo "🧪 Executando testes com cobertura..."
          
          # Limpar diretório de cobertura anterior
          rm -rf coverage/
          
          # Executar testes com cobertura específica para services
          npm run test:cov -- \
            --testPathPattern=".*\.service\.spec\.ts$" \
            --collectCoverageFrom="src/**/*.service.ts" \
            --coverageThreshold='{}' \
            --passWithNoTests=false

      - name: Validate test coverage
        run: |
          echo "📊 Validando cobertura de testes..."
          
          # Verificar se arquivo de cobertura existe
          if [ ! -f "coverage/coverage-summary.json" ]; then
            echo "❌ Arquivo de cobertura não encontrado!"
            echo "📁 Conteúdo do diretório coverage:"
            ls -la coverage/ 2>/dev/null || echo "Diretório coverage não existe"
            exit 1
          fi
          
          # Instalar Node.js script para parsing JSON
          cat > parse_coverage.js << 'EOF'
          const fs = require('fs');
          const path = require('path');
          
          try {
            const coverageFile = path.join(process.cwd(), 'coverage', 'coverage-summary.json');
            
            if (!fs.existsSync(coverageFile)) {
              console.error('Coverage file not found');
              process.exit(1);
            }
            
            const coverage = JSON.parse(fs.readFileSync(coverageFile, 'utf8'));
            
            // Extrair métricas de cobertura
            const metrics = {
              statements: coverage.total.statements.pct || 0,
              branches: coverage.total.branches.pct || 0,
              functions: coverage.total.functions.pct || 0,
              lines: coverage.total.lines.pct || 0
            };
            
            // Usar a métrica de lines como principal
            const mainCoverage = metrics.lines;
            
            console.log(`📊 Métricas de Cobertura:`);
            console.log(`   Statements: ${metrics.statements}%`);
            console.log(`   Branches: ${metrics.branches}%`);
            console.log(`   Functions: ${metrics.functions}%`);
            console.log(`   Lines: ${metrics.lines}%`);
            console.log(`\n🎯 Cobertura Principal (Lines): ${mainCoverage}%`);
            
            // Definir threshold mínimo
            const minCoverage = 60;
            
            if (mainCoverage < minCoverage) {
              console.log(`❌ FALHA: Cobertura de ${mainCoverage}% está abaixo do mínimo exigido de ${minCoverage}%`);
              process.exit(1);
            }
            
            console.log(`✅ SUCESSO: Cobertura de ${mainCoverage}% atende o mínimo exigido de ${minCoverage}%`);
            
            // Exportar para uso em próximos steps
            console.log(`COVERAGE_PERCENT=${mainCoverage}`);
            
          } catch (error) {
            console.error('Erro ao processar cobertura:', error.message);
            process.exit(1);
          }
          EOF
          
          # Executar parsing e capturar resultado
          node parse_coverage.js > coverage_result.txt 2>&1
          COVERAGE_STATUS=$?
          
          # Mostrar resultado
          cat coverage_result.txt
          
          # Extrair porcentagem para próximos steps
          COVERAGE_PERCENT=$(grep "COVERAGE_PERCENT=" coverage_result.txt | cut -d'=' -f2 || echo "0")
          echo "coverage_percent=$COVERAGE_PERCENT" >> $GITHUB_OUTPUT
          
          # Verificar se passou no threshold
          if [ $COVERAGE_STATUS -ne 0 ]; then
            echo "💥 Deploy cancelado devido à cobertura insuficiente"
            exit 1
          fi

      - name: Verify no console usage (optional)
        run: |
          echo "🚫 Verificando uso de console.*..."
          
          # Procurar por console.log, console.error, etc. excluindo testes
          CONSOLE_USAGE=$(grep -r "console\." src/ --include="*.ts" --exclude-dir=test --exclude="*.spec.ts" --exclude="*.test.ts" || true)
          
          if [ -n "$CONSOLE_USAGE" ]; then
            echo "⚠️  AVISO: Encontrado uso de console.* em:"
            echo "$CONSOLE_USAGE"
            echo "📝 Considere usar um logger adequado (winston, pino, etc.)"
            # Não falhar o deploy por isso, apenas avisar
          else
            echo "✅ Nenhum console.* encontrado no código de produção"
          fi

      - name: SonarQube Quality Gate Check
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          echo "🔍 Executando análise SonarQube..."
          
          # Instalar sonar-scanner
          npm install -g sonar-scanner
          
          # Executar análise
          sonar-scanner \
            -Dsonar.projectKey=Athenas-Corp_Athenas \
            -Dsonar.organization=athenas-corp \
            -Dsonar.host.url=https://sonarcloud.io \
            -Dsonar.token=${SONAR_TOKEN} \
            -Dsonar.branch.name=${GITHUB_REF#refs/heads/} \
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info \
            -Dsonar.coverage.exclusions="**/*.spec.ts,**/*.test.ts,**/*.module.ts,**/*.config.ts" \
            -Dsonar.sources=src \
            -Dsonar.tests=src \
            -Dsonar.test.inclusions="**/*.spec.ts,**/*.test.ts" \
            -Dsonar.typescript.tsconfigPath=tsconfig.json

      - name: Get current version and calculate next version
        id: version
        run: |
          CURRENT_VERSION=$(jq -r .version package.json)
          echo "current_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT

          # Buscar última tag
          LAST_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          echo "last_tag=$LAST_TAG" >> $GITHUB_OUTPUT

          # Extrair números da versão (remove 'v' se existir)
          CLEAN_VERSION=${LAST_TAG#v}

          # Separar major, minor, patch usando IFS
          IFS='.' read -ra VERSION_PARTS <<< "$CLEAN_VERSION"
          MAJOR=${VERSION_PARTS[0]:-0}
          MINOR=${VERSION_PARTS[1]:-0}
          PATCH=${VERSION_PARTS[2]:-0}

          # Incrementar patch
          NEW_PATCH=$((PATCH + 1))
          NEW_VERSION="$MAJOR.$MINOR.$NEW_PATCH"
          NEW_TAG="v$NEW_VERSION"

          echo "new_version=$NEW_VERSION" >> $GITHUB_OUTPUT
          echo "new_tag=$NEW_TAG" >> $GITHUB_OUTPUT

          echo "📋 Versão atual no package.json: $CURRENT_VERSION"
          echo "📋 Última tag: $LAST_TAG"
          echo "📋 Nova versão: $NEW_VERSION"
          echo "📋 Nova tag: $NEW_TAG"

      - name: Update package.json version
        run: |
          NEW_VERSION="${{ steps.version.outputs.new_version }}"

          # Atualizar package.json
          jq ".version = \"$NEW_VERSION\"" package.json > package.json.tmp
          mv package.json.tmp package.json

          # Atualizar package-lock.json se existir
          if [ -f package-lock.json ]; then
            jq ".version = \"$NEW_VERSION\"" package-lock.json > package-lock.json.tmp
            mv package-lock.json.tmp package-lock.json
          fi

          echo "✅ Versão atualizada para $NEW_VERSION"

      - name: Commit version update
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git remote set-url origin https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
          
          git add package.json package-lock.json
          git commit -m "chore: bump version to ${{ steps.version.outputs.new_version }} [skip ci]" || true
          git push origin main

      - name: Create and push tag
        run: |
          NEW_TAG="${{ steps.version.outputs.new_tag }}"

          # Criar tag anotada
          git tag -a "$NEW_TAG" -m "Release $NEW_TAG - Auto-generated by GitHub Actions"

          # Push da tag
          git push origin "$NEW_TAG"

          echo "✅ Tag $NEW_TAG criada e enviada"

      - name: Create GitHub Release
        uses: actions/create-release@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.version.outputs.new_tag }}
          release_name: Release ${{ steps.version.outputs.new_tag }}
          body: |
            ## 🚀 Release ${{ steps.version.outputs.new_tag }}

            ### ✅ Quality Checks Passed
            - ✅ Linting passed
            - ✅ Tests passed with ${{ steps.validate-coverage.outputs.coverage_percent }}% coverage (>60% required)
            - ✅ SonarQube quality gate passed

            ### 📊 Test Coverage Report
            Coverage: ${{ steps.validate-coverage.outputs.coverage_percent }}%

            ### 🔗 Links
            - **SonarQube**: https://sonarcloud.io/dashboard?id=Athenas-Corp_Athenas
            - **Full Changelog**: https://github.com/${{ github.repository }}/compare/${{ steps.version.outputs.last_tag }}...${{ steps.version.outputs.new_tag }}
          draft: false
          prerelease: false

      - name: Deploy Application
        run: |
          echo "🚀 Iniciando deploy da versão ${{ steps.version.outputs.new_version }}"
          echo "📊 Deploy aprovado com ${{ steps.validate-coverage.outputs.coverage_percent }}% de cobertura"
          
          # Aqui você pode adicionar seus comandos de deploy específicos
          # Exemplos:
          # - Build da aplicação
          # - Deploy para AWS/Azure/GCP
          # - Build e push de Docker images
          # - Deploy para Kubernetes
          # - Notificações (Slack, Discord, etc.)
          
          echo "✅ Deploy realizado com sucesso!"

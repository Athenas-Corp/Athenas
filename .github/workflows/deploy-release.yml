name: Release Pipeline Detailed

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      node-version: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Build NestJS project
        run: npm run build

  lint:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run ESLint
        run: npm run lint

  test-and-coverage:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      - name: Run All Tests with Coverage
        run: npm run test:all -- --coverage

      - name: Check Coverage
        run: |
          COVERAGE=$(node -e "console.log(require('./coverage/coverage-summary.json').total.lines.pct)")
          echo "Total Coverage: $COVERAGE%"
          if (( $(echo "$COVERAGE < 60" | bc -l) )); then
            echo "❌ Coverage below 60%!"
            exit 1
          fi

      # ✅ UPLOAD DOS ARQUIVOS DE COVERAGE COMO ARTIFACT
      - name: Upload Coverage Reports
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            coverage/
            !coverage/tmp/
          retention-days: 1

  sonar:
    runs-on: ubuntu-latest
    needs: test-and-coverage
    steps:
      - uses: actions/checkout@v4
        with:
          # ✅ FETCH COMPLETO PARA EVITAR SHALLOW CLONE
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Cache Node modules
        uses: actions/cache@v3
        with:
          path: ~/.npm
          key: ${{ runner.os }}-node-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            ${{ runner.os }}-node-

      - name: Install dependencies
        run: npm ci

      # ✅ DOWNLOAD DOS ARQUIVOS DE COVERAGE NA RAIZ
      - name: Download Coverage Reports
        uses: actions/download-artifact@v4
        with:
          name: coverage-reports
          path: ./

      # ✅ VERIFICAR E ORGANIZAR OS ARQUIVOS BAIXADOS
      - name: Verify and Organize Coverage Files
        run: |
          echo "📋 Checking downloaded files..."
          ls -la
          echo ""

          # ✅ Verificar se lcov.info existe na raiz (onde foi baixado)
          if [ -f "lcov.info" ]; then
            echo "✅ LCOV file found at root - organizing files..."
            
            # Criar pasta coverage se não existir
            mkdir -p coverage
            
            # Mover arquivos para a pasta coverage
            if [ -f "lcov.info" ]; then
              mv lcov.info coverage/
              echo "✅ Moved lcov.info to coverage/"
            fi
            
            if [ -f "coverage-summary.json" ]; then
              mv coverage-summary.json coverage/
              echo "✅ Moved coverage-summary.json to coverage/"
            fi
            
            if [ -d "lcov-report" ]; then
              mv lcov-report coverage/
              echo "✅ Moved lcov-report/ to coverage/"
            fi
            
            echo ""
            echo "📋 Final coverage directory structure:"
            ls -la coverage/
            echo ""
            echo "📋 First 5 lines of LCOV file:"
            head -5 coverage/lcov.info
            
          else
            echo "❌ LCOV file not found"
            exit 1
          fi

      - name: SonarQube Scan
        uses: sonarsource/sonarqube-scan-action@v3
        with:
          args: >
            -Dsonar.projectKey=Athenas-Corp_Athenas
            -Dsonar.organization=athenas-corp
            -Dsonar.sources=src
            -Dsonar.tests=src
            -Dsonar.test.inclusions="**/*.spec.ts"
            -Dsonar.javascript.lcov.reportPaths=coverage/lcov.info
            -Dsonar.coverage.exclusions="**/*.spec.ts,**/*.mock.ts,**/__tests__/**,**/__mocks__/**"
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
          SONAR_HOST_URL: ${{ secrets.SONAR_HOST_URL }}

  deploy-and-tag:
    runs-on: ubuntu-latest
    needs: sonar
    steps:
      - uses: actions/checkout@v4

      - name: Create Tag
        id: tag
        run: |
          VERSION="v$(date +'%Y.%m.%d.%H%M')"
          echo "TAG=$VERSION" >> $GITHUB_ENV
          git config user.name "github-actions"
          git config user.email "actions@github.com"
          git tag $VERSION
          git push origin $VERSION

      - name: Deploy to Production
        run: |
          echo "🚀 Deploying version $TAG to production..."
          # aqui você integra com o seu deploy real

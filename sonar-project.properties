# sonar-project.properties
sonar.projectKey=Athenas-Corp_Athenas
sonar.organization=athenas-corp
sonar.host.url=https://sonarcloud.io

# Configurações do projeto
sonar.projectName=Athenas
sonar.projectVersion=0.0.1
sonar.sourceEncoding=UTF-8

# Arquivos para análise
sonar.sources=src
sonar.tests=src

# Padrões de inclusão e exclusão
sonar.test.inclusions=**/*.spec.ts,**/*.test.ts
sonar.exclusions=**/*.spec.ts,**/*.test.ts,**/node_modules/**,**/dist/**,**/coverage/**,**/*.d.ts

# Configurações TypeScript/JavaScript
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.tsconfigPath=tsconfig.json

# Configurações de cobertura - arquivos que NÃO devem ser considerados para cobertura
sonar.coverage.exclusions=**/*.spec.ts,**/*.test.ts,**/*.module.ts,**/*.config.ts,**/main.ts,**/dto/**/*.ts,**/entities/**/*.ts,**/interfaces/**/*.ts,**/types/**/*.ts,**/constants/**/*.ts,**/enums/**/*.ts

# Quality Gate
sonar.qualitygate.wait=true
sonar.qualitygate.timeout=300

# Configurações adicionais para análise mais robusta
sonar.javascript.environments=node

# Configurações de duplicação de código
sonar.cpd.exclusions=**/*.spec.ts,**/*.test.ts,**/*.module.ts,**/*.dto.ts

# Configurações de análise
sonar.analysis.mode=publish

# Configurações para JavaScript/TypeScript
sonar.typescript.lcov.reportPaths=coverage/lcov.info
sonar.javascript.lcov.reportPaths=coverage/lcov.info
sonar.typescript.node.maxspace=4096

# Desabilitar algumas regras que podem ser problemáticas em projetos NestJS
sonar.issue.ignore.multicriteria=e1,e2
sonar.issue.ignore.multicriteria.e1.ruleKey=typescript:S3776
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*.service.ts
sonar.issue.ignore.multicriteria.e2.ruleKey=typescript:S1488
sonar.issue.ignore.multicriteria.e2.resourceKey=**/*.controller.ts
